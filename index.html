<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos Utilidade Pública</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <div id="geral">
        <header>
            <h1>Sistema de Contatos de Utilidade Pública</h1>
            <hr>
            <h2>Esse é uma aplicação simples com fins educacionais para consultar números de utilidade pública. São
                números que dpeendendo da situação é fundamental ter conhecimento. </h2>
        </header>

        <main>
            <label for="departamento">Selecione o departamento:</label>
            <select onchange="consultar()" id="selecao">
                <option selected disabled>Selecione</option>
                <option value="1">Polícia Militar</option>
                <option value="2">Bombeiros</option>
                <option value="3">SAMU</option>
                <option value="4">Defesa Civil</option>
                <option value="5">Polícia Civil</option>
                <option value="6">Delegacia do Turista(DEAT)</option>
                <option value="7">Disque Denúncia</option>
                <option value="8">Central de Atendimento à Mulher</option>
                <option value="9">Direitos Humanos</option>
                <option value="10">Procon</option>
                <option value="11">HemoRio</option>
                <option value="12">Detran</option>
                <option value="13">Disque Ambiente</option>
            </select>
            <div id="resultado"></div>
        </main>
    </div>
    <footer>
        <div id="imagens">
<img src="imagens/clip.gif">

        </div>
    </footer>
</body>

</html>
